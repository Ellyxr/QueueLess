kind = "web"
previewPath = "/"
title = "QueueLess"
description = "Foundation scaffold for QueueLess, a campus marketplace and delivery coordination platform for buyers, vendors, and administrators."
version = "1.0.0"
id = "artifacts/frontend"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18130

[services.development]
run = "pnpm --filter @workspace/frontend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/frontend", "run", "build" ]
serve = "static"
publicDir = "artifacts/frontend/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18130"
BASE_PATH = "/"

name: CI Quality Gates

on:
  pull_request:
    branches: ["main"]

jobs:
  # BUG-001 / TC-010: lint and type checks run on every PR and report their
  # own status, separately from the build and tests.
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The API's types come from the generated Prisma client.
      - name: Generate Prisma client
        run: pnpm --filter @workspace/api-server prisma:generate

      - name: Typecheck (shared libs, API, frontend, scripts)
        run: pnpm run typecheck

      # BUG-003 / TC-012: docs/erd.mmd must match schema.prisma.
      - name: ERD is up to date with schema.prisma
        run: pnpm --filter @workspace/api-server erd:check

      - name: Lint API
        run: pnpm --filter @workspace/api-server lint

      - name: Lint frontend
        run: pnpm --filter @workspace/frontend lint

  build-and-check:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @workspace/api-server prisma:generate

      - name: Validate Prisma schema
        run: pnpm --filter @workspace/api-server prisma:validate

      - name: Build applications
        run: pnpm --filter @workspace/frontend... --filter @workspace/api-server... build

      # US-054: regression and failure-path tests (duplicate order/payment,
      # invalid transitions, unauthorized access, invalid webhooks, realtime
      # recovery). They run against the compiled API, so they follow the build.
      - name: Run backend tests
        run: pnpm --filter @workspace/api-server test

  # BUG-002 / TC-011: every PR applies all Prisma migrations to a clean
  # PostgreSQL and fails if one breaks, is pending/failed, or if the result
  # does not match schema.prisma (schema edited without a migration).
  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrations
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/migrations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @workspace/api-server prisma:generate

      - name: Apply all migrations to a clean database
        run: pnpm --filter @workspace/api-server exec prisma migrate deploy

      - name: Migration status (nothing pending or failed)
        run: pnpm --filter @workspace/api-server exec prisma migrate status

      - name: Schema drift check (migrations match schema.prisma)
        run: pnpm --filter @workspace/api-server exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Verify database (connections and migrations)
        run: pnpm --filter @workspace/api-server db:verify
name: CI Quality Gates

on:
  pull_request:
    branches: ["main"]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @workspace/api-server prisma:generate

      - name: Validate Prisma schema
        run: pnpm --filter @workspace/api-server prisma:validate

      - name: Build applications
        run: pnpm --filter @workspace/frontend... --filter @workspace/api-server... build